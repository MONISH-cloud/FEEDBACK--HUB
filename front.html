<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedHub - Your Social Feed Aggregator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 2rem;
            max-width: 800px;
        }

        .logo {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: white;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00e6e6,
                0 0 30px #00e6e6,
                0 0 40px #00e6e6;
            animation: neon-pulse 2s infinite alternate;
        }

        .tagline {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .start-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            text-decoration: none;
            display: inline-block;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.7),
                inset 0 0 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        /* Animated Background Elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(40px);
            animation: float 15s infinite linear;
        }

        .element-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ffffff, transparent);
            top: 10%;
            left: 5%;
            animation-duration: 20s;
        }

        .element-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00e6e6, transparent);
            bottom: 5%;
            right: 10%;
            animation-duration: 25s;
        }

        .element-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffffff, transparent);
            top: 50%;
            left: 15%;
            animation-duration: 18s;
        }

        .element-4 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00e6e6, transparent);
            bottom: 20%;
            left: 20%;
            animation-duration: 22s;
        }

        /* Grid Lines */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        /* Neon Circles */
        .neon-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 230, 230, 0.3);
            box-shadow: 0 0 10px rgba(0, 230, 230, 0.5);
            animation: neon-rotate 20s infinite linear;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            top: -100px;
            left: -100px;
            animation-duration: 40s;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 10%;
            animation-duration: 25s;
        }

        /* Floating Icons */
        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.7;
            color: #00e6e6;
            text-shadow: 0 0 10px rgba(0, 230, 230, 0.7);
            animation: float-icon 10s infinite ease-in-out;
        }

        .icon-1 {
            top: 20%;
            right: 15%;
            animation-delay: 0s;
        }

        .icon-2 {
            bottom: 30%;
            left: 10%;
            animation-delay: 2s;
        }

        .icon-3 {
            top: 40%;
            right: 25%;
            animation-delay: 4s;
        }

        .icon-4 {
            bottom: 15%;
            right: 20%;
            animation-delay: 6s;
        }

        /* Loading Animation */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00e6e6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(0, 230, 230, 0.5);
        }

        /* Animations */
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(50px, 50px) rotate(90deg);
            }
            50% {
                transform: translate(0, 100px) rotate(180deg);
            }
            75% {
                transform: translate(-50px, 50px) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        @keyframes float-icon {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        @keyframes neon-pulse {
            0% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px #00e6e6,
                    0 0 30px #00e6e6,
                    0 0 40px #00e6e6;
            }
            100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 15px #fff,
                    0 0 25px #00e6e6,
                    0 0 40px #00e6e6,
                    0 0 50px #00e6e6;
            }
        }

        @keyframes grid-move {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        @keyframes neon-rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 3.5rem;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .start-btn {
                padding: 1rem 2.5rem;
                font-size: 1.1rem;
            }
            
            .bg-element, .neon-circle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Background Elements -->
    <div class="grid-lines"></div>
    
    <div class="bg-element element-1"></div>
    <div class="bg-element element-2"></div>
    <div class="bg-element element-3"></div>
    <div class="bg-element element-4"></div>
    
    <!-- Neon Circles -->
    <div class="neon-circle circle-1"></div>
    <div class="neon-circle circle-2"></div>
    <div class="neon-circle circle-3"></div>
    
    <!-- Floating Icons -->
    <div class="floating-icon icon-1">
        <i class="fas fa-rss"></i>
    </div>
    <div class="floating-icon icon-2">
        <i class="fas fa-share-alt"></i>
    </div>
    <div class="floating-icon icon-3">
        <i class="fas fa-users"></i>
    </div>
    <div class="floating-icon icon-4">
        <i class="fas fa-heart"></i>
    </div>
    
    <!-- Main Content -->
    <div class="container">
        <h1 class="logo">FeedHub</h1>
        <p class="tagline">Your Ultimate Social Feed Aggregator</p>
        <button class="start-btn" id="startButton">Get Started</button>
    </div>

    <script>
        document.getElementById('startButton').addEventListener('click', function() {
            // Show loading animation
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('active');
            
            // Change button text and style
            this.innerHTML = 'Launching FeedHub...';
            this.style.borderColor = '#00e6e6';
            this.style.boxShadow = '0 0 20px rgba(0, 230, 230, 0.7), inset 0 0 15px rgba(0, 230, 230, 0.2)';
            this.disabled = true;
            
            // Navigate to index.html after a short delay to show the loading animation
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
